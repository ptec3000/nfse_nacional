name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Gem instalada, fora do checkout e do Bundler
        run: |
          gem build nfse_nacional.gemspec
          gem install --no-document ./nfse_nacional-*.gem
          cd "$RUNNER_TEMP"
          env -u BUNDLE_GEMFILE -u RUBYOPT ruby "$GITHUB_WORKSPACE/script/check_installed" "$GITHUB_WORKSPACE/test/support/test_certificate.rb"
